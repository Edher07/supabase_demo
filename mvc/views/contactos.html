$def with (datos)
<h1>Contactos</h1>

<a href="/insertar_contacto">Nuevo Contacto</a>

<table>
    <thead>
        <tr>
            <th>Foto</th>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Ver</th>
            <th>Actualizar</th>
            <th>Borrar</th>
        </tr>
    </thead>
    <tbody>
        $for registro in datos:   
            <tr>
                <td><img src="/static/fotos/$registro['foto']" height="100px" width="100px"></td>
                <td>$registro["id"]</td>
                <td>$registro["nombre"]</td>
                <td>$registro["email"]</td>
                <td>$registro["telefono"]</td>
                <td><a href = "ver_contacto/$registro['id']">Ver</a></td>
                <td><a href = "actualizar_contacto/$registro['id']">Actualizar</a></td>
                <td><a href = "borrar_contacto/$registro['id']">Borrar</a></td>

            </tr>
    </tbody>
</table>
